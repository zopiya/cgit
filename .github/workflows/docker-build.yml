name: Build and publish cgit image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
  workflow_dispatch: {}

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value={{commit_date 'YYYYMMDD'}}-{{sha}}

      # Load locally first (not pushed yet) so the image can be smoke
      # tested before anything reaches the registry — a build succeeding
      # doesn't guarantee the container actually runs (this exact pipeline
      # briefly proved that: an earlier version passed `docker build`
      # cleanly while silently rebuilding cgit.o without the musl compat
      # flags right before `install`). Reuses this run's own layer cache,
      # so the later push step is a fast no-op rebuild, not a second full
      # compile.
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          set -e
          image="$(echo '${{ steps.meta.outputs.tags }}' | head -n1)"
          # Override the image's own HEALTHCHECK timing (interval=30s,
          # right for production, needlessly slow for CI) just for this
          # container — the check command itself is unchanged.
          docker run -d --name cgit-smoke -p 127.0.0.1:8080:8080 \
            --health-interval=3s --health-start-period=2s --health-retries=3 \
            "$image"
          # Poll a static asset (always 200 once lighttpd is up) rather
          # than / — cgit legitimately returns 404 for / when scan-path
          # finds zero repos, which is exactly this smoke-test container's
          # situation (no /repos mounted). See Dockerfile's HEALTHCHECK
          # comment for the same reasoning.
          ok=0
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8080/cgit.css > /dev/null; then
              ok=1
              break
            fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "::error::cgit container never responded"
            echo "--- curl -v /cgit.css ---"
            curl -v http://127.0.0.1:8080/cgit.css || true
            echo "--- ls -la /var/www/htdocs/cgit ---"
            docker exec cgit-smoke ls -la /var/www/htdocs/cgit || true
            echo "--- docker logs ---"
            docker logs cgit-smoke
            exit 1
          fi

          # Separately confirm cgit.cgi itself actually renders (not just
          # that lighttpd is up) — status code isn't checked here on
          # purpose (see above: 404 is valid for an empty repo list),
          # just that the response body looks like real cgit output.
          curl -sS http://127.0.0.1:8080/ > /tmp/smoke.html
          grep -qi "cgit" /tmp/smoke.html || { echo "::error::response didn't look like cgit"; cat /tmp/smoke.html; exit 1; }

          # Also confirm the image's own HEALTHCHECK (internal wget call)
          # actually works, not just that curl can reach it from outside —
          # a broken/missing healthcheck binary wouldn't be caught by the
          # check above.
          healthy=0
          for i in $(seq 1 20); do
            status="$(docker inspect --format='{{.State.Health.Status}}' cgit-smoke)"
            if [ "$status" = "healthy" ]; then
              healthy=1
              break
            fi
            sleep 3
          done
          if [ "$healthy" != "1" ]; then
            echo "::error::container HEALTHCHECK never reported healthy (last status: $status)"
            docker inspect --format='{{json .State.Health}}' cgit-smoke
            docker logs cgit-smoke
            exit 1
          fi

          docker rm -f cgit-smoke

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
