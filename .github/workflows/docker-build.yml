name: Verify and optionally publish cgit

on:
  pull_request:
  push:
    branches: [main, 'work/**']
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the tested image from main (never deploys a service)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CGIT_TEST_RESTIC: /usr/bin/restic

jobs:
  protocol:
    name: Go runtime and protocol baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install the real recovery test client
        run: |
          sudo apt-get update
          sudo apt-get install -y restic
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          cache: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify clients and inventory
        run: |
          git lfs version
          shellcheck docker-entrypoint.sh docker-ssh-entrypoint.sh docker-maintenance-entrypoint.sh
          go mod verify
          go vet ./...
          mkdir -p bin artifacts
          go build -trimpath -o bin/cgit-runtime ./cmd/cgit-runtime
          python3 -m compileall -q tests scripts
          python3 scripts/check_contracts.py --stage baseline
      - name: Check Go dependencies for reachable vulnerabilities
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -json ./... > artifacts/go-vuln.json
          python3 scripts/check_go_vulnerabilities.py artifacts/go-vuln.json --report artifacts/go-vuln-gate.json
      - name: Local protocol regression (Web intentionally belongs to container job)
        run: python3 scripts/test.py --driver cgi --report artifacts/protocol.json
      - name: Collect synthetic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: protocol-evidence-${{ github.run_id }}
          path: artifacts/*.json
          if-no-files-found: error
          retention-days: 14

  container:
    name: Required Linux image and black-box contracts
    needs: protocol
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate documented Compose combinations (no services started)
        run: python3 scripts/check_compose.py
      - name: Install the real recovery test client
        run: |
          sudo apt-get update
          sudo apt-get install -y restic
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          cache: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Build host tools for independent fixture setup
        run: |
          mkdir -p bin artifacts
          go build -trimpath -o bin/cgit-runtime ./cmd/cgit-runtime
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build once for tests and optional publication
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: cgit:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # No registry login or production credentials in either test job.
      - name: Build isolated maintenance runtime
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile.maintenance
          platforms: linux/amd64
          load: true
          tags: cgit-maintenance:ci
          cache-from: type=gha,scope=maintenance
          cache-to: type=gha,scope=maintenance,mode=max
      - name: Required real cgit/lighttpd and Git/LFS clients
        env:
          CGIT_TEST_MAINTENANCE_IMAGE: cgit-maintenance:ci
          CGIT_TEST_IMAGE: cgit:ci
          CGIT_TEST_GITOLITE_IMAGE: cgit:ci
        run: |
          docker image inspect cgit:ci --format '{{.Id}}' > /tmp/cgit-tested-image-id
          python3 scripts/check_image.py cgit:ci --report artifacts/image-smoke.json
          python3 scripts/check_contracts.py --stage go
          python3 scripts/test.py --driver docker --require-no-skips --report artifacts/container.json
      - name: Evaluate security evidence
        run: |
          gitleaks_version=8.30.1
          gitleaks_sha256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          gitleaks_dir=/tmp/cgit-gitleaks
          archive="$gitleaks_dir/gitleaks.tar.gz"
          mkdir -p "$gitleaks_dir" artifacts
          curl -fsSL --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${gitleaks_version}/gitleaks_${gitleaks_version}_linux_x64.tar.gz" \
            -o "$archive"
          printf '%s  %s\n' "$gitleaks_sha256" "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$gitleaks_dir" gitleaks
          "$gitleaks_dir/gitleaks" version
          "$gitleaks_dir/gitleaks" detect --no-banner --redact --source . \
            --report-format json --report-path artifacts/secrets.json --exit-code 0
          python3 scripts/security_gate.py \
            --test-report artifacts/container.json \
            --image-report artifacts/image-smoke.json \
            --secret-report artifacts/secrets.json \
            --report artifacts/security.json
      - name: Export the exact tested artifact
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
        run: |
          mkdir -p artifacts/image
          docker save cgit:ci -o artifacts/image/cgit.tar
          cp /tmp/cgit-tested-image-id artifacts/image/image-id
          printf '%s\n' "$GITHUB_SHA" > artifacts/image/source-sha
          sha256sum artifacts/image/cgit.tar > artifacts/image/cgit.tar.sha256
      - name: Collect synthetic test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: container-evidence-${{ github.run_id }}
          path: artifacts/*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Store image only for an explicitly requested trusted publication
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tested-image-${{ github.run_id }}
          path: artifacts/image/
          if-no-files-found: error
          retention-days: 3
      - name: Clean test containers even after failure
        if: always()
        run: |
          docker ps -aq --filter 'name=cgit-tests-' --filter 'name=cgit-contract-' --filter 'name=cgit-image-check-' | xargs -r docker rm -fv

  publish:
    name: Publish the same tested image (manual, main only)
    needs: container
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - name: Download this run's trusted tested artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "tested-image-$GITHUB_RUN_ID" --dir image
      - name: Verify source and exact image before publishing
        run: |
          test "$(cat image/source-sha)" = "$GITHUB_SHA"
          expected="$(cut -d ' ' -f 1 image/cgit.tar.sha256)"
          actual="$(sha256sum image/cgit.tar | cut -d ' ' -f 1)"
          test "$actual" = "$expected"
          docker load -i image/cgit.tar
          test "$(docker image inspect cgit:ci --format '{{.Id}}')" = "$(cat image/image-id)"
      - name: Publish traceable source/run tag and rolling tag
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          tag="sha-$GITHUB_SHA-run-$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT"
          docker tag cgit:ci "$image:$tag"
          docker tag cgit:ci "$image:latest"
          docker push "$image:$tag"
          docker push "$image:latest"
          digest="$(docker image inspect "$image:$tag" --format '{{index .RepoDigests 0}}')"
          docker pull "$digest"
          test "$(docker image inspect "$digest" --format '{{.Id}}')" = "$(cat image/image-id)"
          printf 'Published and pulled tested image: %s\n' "$digest" >> "$GITHUB_STEP_SUMMARY"
