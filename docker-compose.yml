services:
  cgit:
    build: .
    # Or pull the CI-published image instead of building locally:
    #   image: ghcr.io/zopiya/cgit:latest
    # `latest`/`main` float; for a pinned, traceable deployment use the
    # dated tag CI also publishes on every build, e.g.:
    #   image: ghcr.io/zopiya/cgit:20260726-85c44e1
    # (see the repo's package page or `git log` for available tags/shas)
    container_name: cgit
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "${TZ:-UTC}"
    volumes:
      - /volume1/git-repos:/repos:ro
      - cgit-cache:/var/cache/cgit
      # Uncomment to override the baked-in config:
      # - ./config/cgitrc:/etc/cgitrc:ro
    # Published directly on the LAN/Tailscale IP — no VPN, proxy, or
    # domain setup required. If you later put a Caddy (or anything else)
    # in front for a custom domain, run it as its own separate deployment
    # reverse-proxying to this NAS's IP on this port — this container
    # doesn't need to know about it.
    ports:
      - "8080:8080"

    # --- Hardening ---
    # The entrypoint runs as root only long enough to create the PUID/PGID
    # account and chown the cache volume, then drops to it permanently via
    # su-exec — so nothing after startup needs real root power. Drop every
    # capability and add back just what that startup sequence requires.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    # A dropped-privilege process can never regain privileges via exec —
    # compatible with the root->PUID drop above (dropping isn't affected).
    security_opt:
      - no-new-privileges:true
    # CGI upload spool on RAM-backed tmpfs. (read_only: true is deliberately
    # NOT set: the runtime user creation writes /etc/passwd inside the
    # container — fixing that would mean a build-time user and losing
    # PUID/PGID flexibility.)
    tmpfs:
      - /tmp

volumes:
  cgit-cache:
