services:
  cgit:
    build: .
    image: ghcr.io/zopiya/cgit:latest
    restart: unless-stopped
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-Asia/Shanghai}"
      CGIT_WRITE_ROOT: /coordination
      CGIT_BASE_URL: "${CGIT_BASE_URL:-}"
      CGIT_AUTH_MODE: "${CGIT_AUTH_MODE:-public}"
      CGIT_USERNAME: "${CGIT_USERNAME:-}"
      CGIT_PASSWORD_FILE: "${CGIT_PASSWORD_FILE:-}"
      CGIT_HTTP_PUSH: "${CGIT_HTTP_PUSH:-0}"
      CGIT_LFS_MAX_SIZE: "${CGIT_LFS_MAX_SIZE:-10737418240}"
      CGIT_HTTP_MAX_REQUEST_SIZE: "${CGIT_HTTP_MAX_REQUEST_SIZE:-}"
      CGIT_HTTP_IDLE_TIMEOUT: "${CGIT_HTTP_IDLE_TIMEOUT:-300}"
      CGIT_HTTP_MAX_CONNECTIONS: "${CGIT_HTTP_MAX_CONNECTIONS:-1024}"
      CGIT_LFS_MIN_FREE_BYTES: "${CGIT_LFS_MIN_FREE_BYTES:-0}"
      CGIT_GIT_PACK_THREADS: "${CGIT_GIT_PACK_THREADS:-0}"
      CGIT_GIT_PACK_WINDOW_MEMORY: "${CGIT_GIT_PACK_WINDOW_MEMORY:-0}"
      CGIT_SSH_CLONE_URL: "${CGIT_SSH_CLONE_URL:-}"
    volumes:
      - ./repos:/repos:ro
      - ./cache:/var/cache/cgit
      - ./coordination:/coordination
      - ./lfs:/lfs
    ports:
      - "${CGIT_HTTP_BIND:-0.0.0.0}:${CGIT_HTTP_PORT:-8080}:8080"

    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
