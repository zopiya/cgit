# Optional scheduled checks, sync and backups. Works with public/private/access.
# See docs/OPERATIONS.md before enabling backup or sync jobs.
services:
  maintenance:
    build:
      context: .
      dockerfile: Dockerfile.maintenance
    image: ghcr.io/zopiya/cgit-maintenance:latest
    profiles: ["maintenance"]
    restart: unless-stopped
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-Asia/Shanghai}"
      HOME: /job-work
      CGIT_RUNTIME_CONFIG: /var/cache/cgit/runtime/settings.json
    volumes:
      - ./jobs:/jobs:ro
      - ./job-state:/job-state
      - ./job-work:/job-work
      - ./repos:/repos
      - ./lfs:/lfs
      - ./access:/access
      - ./cache:/var/cache/cgit:ro
      - ./coordination:/coordination
      - ./backups:/backups
      - ./secrets:/secrets:ro
    depends_on:
      - cgit
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /run
      - /tmp
