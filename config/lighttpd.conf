server.modules += (
    "mod_cgi",
    "mod_setenv",
    "mod_rewrite",
    "mod_accesslog",
    "mod_deflate"
)

server.document-root = "/var/www/htdocs/cgit"
server.port          = 8080
# No server.errorlog/breakagelog set: lighttpd's actual source (as of
# 1.4.x) drops privileges to the configured user *before* opening log
# files, not after — so under `docker run -d`, an explicit path here
# (including "/dev/stderr" itself) means lighttpd calls a fresh open()
# on it as the already-unprivileged PUID, and the underlying pipe Docker
# sets up for detached containers isn't writable by anyone but its
# original (root) owner. That open() failure made lighttpd exit
# immediately at startup. Leaving these unset makes lighttpd fall back
# to its built-in default, which reuses the process's already-open
# stderr fd directly — no fresh open(), no permission check, always
# works regardless of which PUID ends up running it.
#
# No server.pid-file either: Docker is already the process supervisor
# here, and nothing in this setup reads the pidfile — one less
# permission assumption (same /run-writability concern as above) to
# depend on for no benefit.
server.upload-dirs   = ( "/tmp" )
# Trim the version string lighttpd advertises in the Server header —
# cheap, doesn't affect functionality.
server.tag           = "cgit"

# Unlike errorlog, mod_accesslog has no "just use the inherited fd"
# fallback — it's opt-in only and always does an explicit open() of
# whatever path it's given, so pointing it at /dev/stdout would hit the
# exact same permission problem explained above. Logged to the cache
# volume instead, which the entrypoint already chowns to the target
# PUID/PGID; inspect with `docker exec cgit tail -f /var/cache/cgit/access.log`
# or by mounting that volume elsewhere. No rotation — fine at personal/
# home-NAS traffic levels; reclaim space any time with
# `docker exec cgit sh -c ': > /var/cache/cgit/access.log'` (lighttpd
# opens the log O_APPEND, so truncating the live file is safe).
accesslog.filename   = "/var/cache/cgit/access.log"

# Compress text responses on the fly — cgit's HTML output (source
# listings, diffs, logs) compresses ~5-10x; felt mostly off-LAN, over
# Tailscale. (Unlike mod_auth, Alpine ships mod_deflate inside the base
# lighttpd package — no extra apk line needed.) Dynamic CGI output is
# compressed per-request; cache-dir additionally stores compressed
# copies of *static* files on the cache volume the entrypoint chowns.
deflate.mimetypes    = ( "text/", "application/javascript" )
deflate.cache-dir    = "/var/cache/cgit/compress"

mimetype.assign = (
    ".css" => "text/css",
    ".js"  => "application/javascript",
    ".png" => "image/png",
    ".ico" => "image/x-icon",
    ".txt" => "text/plain"
)

# Anything ending in cgit.cgi (including with PATH_INFO trailing after it,
# e.g. /cgit.cgi/myrepo/log/) is executed as CGI.
cgi.assign = ( "cgit.cgi" => "" )

# Static assets pass through untouched; everything else is routed to
# cgit.cgi with the original path preserved as PATH_INFO, mirroring the
# classic Apache "ScriptAlias /" setup used for cgit. custom.css is the
# local override layer (see cgitrc's second css= line) — miss it here and
# it 404s through the rewrite into cgit.cgi.
url.rewrite-once = (
    "^/(cgit\.css|custom\.css|cgit\.js|cgit\.png|favicon\.ico|robots\.txt)$" => "$0",
    "^(.*)$" => "/cgit.cgi$1"
)

setenv.add-environment = ( "CGIT_CONFIG" => "/etc/cgitrc" )
