# Opt-in multi-user/Gitolite access mode. The access directory contains the
# authoritative Gitolite policy, compiled fragments, identity hashes and hooks.
services:
  cgit:
    environment:
      CGIT_AUTH_MODE: access
      CGIT_ACCESS_ROOT: /access
      CGIT_GITOLITE: /usr/local/bin/gitolite
      CGIT_HTTP_PUSH: "${CGIT_HTTP_PUSH:-1}"
    volumes:
      - ./repos:/repos:rw
      - ./access:/access

  ssh:
    build: .
    image: ghcr.io/zopiya/cgit:latest
    profiles: ["ssh"]
    entrypoint: ["/usr/local/bin/docker-ssh-entrypoint.sh"]
    # The shared image's HTTP healthcheck belongs to the Web role only.
    healthcheck:
      test: ["CMD", "/usr/sbin/sshd", "-t", "-f", "/run/cgit-ssh/sshd_config"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-Asia/Shanghai}"
      CGIT_BASE_URL: "${CGIT_BASE_URL:-}"
      CGIT_AUTH_MODE: access
      CGIT_ACCESS_ROOT: /access
      CGIT_GITOLITE: /usr/local/bin/gitolite
      CGIT_HTTP_PUSH: "${CGIT_HTTP_PUSH:-1}"
      CGIT_SSH_PUSH: "${CGIT_SSH_PUSH:-1}"
      CGIT_LFS_MAX_SIZE: "${CGIT_LFS_MAX_SIZE:-10737418240}"
    volumes:
      - ./repos:/repos:rw
      - ./access:/access
      - ./cache:/var/cache/cgit
      - ./ssh-host-keys:/ssh-host-keys
    ports:
      - "${CGIT_SSH_PORT:-2222}:2222"
    depends_on:
      - cgit
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - SYS_CHROOT
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /run
      - /tmp

  maintenance:
    build:
      context: .
      dockerfile: Dockerfile.maintenance
    image: ghcr.io/zopiya/cgit-maintenance:latest
    profiles: ["maintenance"]
    restart: unless-stopped
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-Asia/Shanghai}"
      HOME: /job-work
      CGIT_RUNTIME_CONFIG: /var/cache/cgit/runtime/settings.json
    volumes:
      - ./jobs:/jobs:ro
      - ./job-state:/job-state
      - ./job-work:/job-work
      - ./repos:/repos
      - ./lfs:/lfs
      - ./access:/access
      - ./cache:/var/cache/cgit:ro
      - ./coordination:/coordination
      - ./backups:/backups
      - ./secrets:/secrets:ro
    depends_on:
      - cgit
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /run
      - /tmp
